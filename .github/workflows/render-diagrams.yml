name: Render Mermaid Diagrams to PNG

on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Install Chromium for puppeteer
        run: npx puppeteer browsers install chrome

      - name: Create output directory
        run: mkdir -p docs/diagrams

      - name: Extract and render diagrams from README
        run: node .github/scripts/extract-diagrams.js

      - name: Commit and push rendered PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/*.png
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: auto-render Mermaid diagrams to PNG"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/companydevs/skill-link-gh.git HEAD:main
